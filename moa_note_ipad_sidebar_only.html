<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>모아 노트 ♡</title><style>
:root{--pink:#d68d9d;--ink:#51464d;--muted:#9a8790;--bg:#fff8f6;--line:#f0dfe2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:12px;color:var(--ink);padding:9px 12px}button:active{transform:scale(.98)}button.primary{background:var(--pink);color:white;border-color:var(--pink)}.app{display:grid;grid-template-columns:265px minmax(0,1fr);height:100dvh}.sidebar{background:#fff;border-right:1px solid var(--line);padding:22px 15px;overflow:auto}.brand{font-size:25px;font-weight:800;color:#b76d81;margin:4px 8px 6px}.subtitle{font-size:12px;color:var(--muted);margin:0 8px 24px}.side-head{display:flex;align-items:center;justify-content:space-between;margin:18px 7px 10px;font-size:12px;color:var(--muted);font-weight:700}.note-item{width:100%;display:block;text-align:left;border:0;padding:13px 12px;margin:5px 0;border-radius:13px;background:transparent}.note-item.active{background:#fff0f2}.note-item strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.note-item small{display:block;color:var(--muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.main{min-width:0;overflow:auto;position:relative}.topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:8px;padding:12px 22px;background:#fffdfceE;border-bottom:1px solid var(--line);backdrop-filter:blur(10px);flex-wrap:wrap}.topbar .spacer{flex:1}.topbar .state{font-size:12px;color:var(--muted)}.paper{max-width:850px;margin:26px auto 100px;padding:28px 42px 55px;background:#fff;border:1px solid #f3e6e8;border-radius:22px;box-shadow:0 12px 38px #b9889710;min-height:70vh}.date{font-size:13px;color:#b98797}.title{display:block;width:100%;font-size:30px;font-weight:800;color:var(--ink);border:0;outline:none;background:transparent;m .app.sidebar-hidden{grid-template-columns:0 minmax(0,1fr)}

</style></head><body><div class="app"><aside class="sidebar" id="sidebar"><button class="sidebar-close" id="closeSidebar" title="노트 목록 닫기" aria-label="노트 목록 닫기">✕</button><div class="brand">✿ Moa Note</div><p class="subtitle">나의 하루를 모으는 공간 ♡</p><button class="primary" id="newNote" style="width:100%">＋ 새 노트 만들기</button><div class="side-head"><span>나의 노트</span><span id="count"></span></div><div id="noteList"></div><div class="notice">🌷 이 첫 버전은 현재 기기에 자동 저장돼요. 구글 로그인과 기기 간 동기화는 다음 단계에서 연결할 예정이에요.</div></aside><main class="main"><div class="topbar"><button class="mobile-menu" id="menu">☰ 노트</button><button id="back" title="실행 취소">↶ 되돌리기</button><button id="forward" title="다시 실행">↷ 다시 실행</button><span class="spacer"></span><span class="state" id="state">자동 저장</span><button id="export">↓ 백업</button><button id="import">↑ 불러오기</button><input type="file" id="importFile" accept=".json" hidden><button id="deleteNote">노트 삭제</button></div><article class="paper"><div class="date" id="date"></div><input class="title" id="title" placeholder="오늘의 기록 ♡" aria-label="노트 제목"><div class="section"><h3>♡ 오늘의 기분</h3><div class="moods" id="moods"></div></div><div class="section"><div class="editor-head"><h3>✓ 오늘의 할 일</h3><button id="addTask">＋ 할 일</button></div><div id="tasks"></div></div><div class="section"><div class="editor-head"><h3>✎ 나의 자유 노트</h3><span style="font-size:12px;color:var(--muted)">글 · 사진 · 그림을 한 페이지에</span></div><div class="toolbar"><button id="addText">＋ 글쓰기</button><button id="addImage">▧ 사진 넣기</button><button id="addDrawing">✎ 그림 그리기</button><input id="imageFile" type="file" accept="image/*" multiple hidden></div><div id="blocks"></div></div><div class="footer">작은 순간들이 모여 소중한 하루가 돼요 ♡</div></article></main></div><script>
(()=>{'use strict';const $=id=>document.getElementById(id);const DB='moa-note-db',STORE='data',KEY='notes-v1';let db=null,notes=[],active=null,undo=[],redo=[],saveTimer=null,painting=null;const uid=()=>crypto.randomUUID?.()||'id'+Date.now()+Math.random();const today=()=>new Date().toISOString().slice(0,10);const fresh=()=>({id:uid(),title:'오늘의 기록 ♡',date:today(),mood:'😊',tasks:[],blocks:[{id:uid(),type:'text',content:''}],updated:Date.now()});const current=()=>notes.find(n=>n.id===active);const clone=x=>JSON.parse(JSON.stringify(x));function openDB(){return new Promise(resolve=>{try{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>{db=r.result;resolve()};r.onerror=()=>resolve()}catch{resolve()}})}function dbGet(){return new Promise(resolve=>{if(!db)return resolve(null);const t=db.transaction(STORE,'readonly').objectStore(STORE).get(KEY);t.onsuccess=()=>resolve(t.result);t.onerror=()=>resolve(null)})}function dbPut(v){return new Promise(resolve=>{if(!db){try{localStorage.setItem(KEY,JSON.stringify(v))}catch{}return resolve()}const t=db.transaction(STORE,'readwrite').objectStore(STORE).put(v,KEY);t.onsuccess=()=>resolve();t.onerror=()=>resolve()})}function save(){const n=current();if(n)n.updated=Date.now();$('state').textContent='저장 중…';clearTimeout(saveTimer);saveTimer=setTimeout(async()=>{await dbPut({notes,active});$('state').textContent='✓ 자동 저장됨';renderList()},450)}function snapshot(){undo.push(clone({notes,active}));if(undo.length>40)undo.shift();redo=[];buttons()}function buttons(){$('back').disabled=!undo.length;$('forward').disabled=!redo.length}function restore(v){notes=v.notes;active=v.active;render();save()}$('back').onclick=()=>{if(!undo.length)return;redo.push(clone({notes,active}));restore(undo.pop());buttons()};$('forward').onclick=()=>{if(!redo.length)return;undo.push(clone({notes,active}));restore(redo.pop());buttons()};function renderList(){$('count').textContent=notes.length+'개';$('noteList').replaceChildren();for(const n of [...notes].sort((a,b)=>b.updated-a.updated)){const b=document.createElement('button');b.className='note-item'+(n.id===active?' active':'');const title=document.createElement('strong');title.textContent=n.title||'제목 없는 노트';const sub=document.createElement('small');sub.textContent=n.date+' · '+(n.blocks.find(b=>b.type==='text')?.content||'새로운 기록').replace(/<[^>]*>/g,'').slice(0,24);b.append(title,sub);b.onclick=()=>{active=n.id;undo=[];redo=[];render();save();setSidebarHidden(true)};$('noteList').append(b)}}function render(){const n=current();if(!n)return;painting=null;$('title').value=n.title;$('date').textContent=new Date(n.date+'T12:00:00').toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'long'});$('moods').replaceChildren();for(const m of ['🥰','😊','😐','😢','😤','😴','🤩']){const b=document.createElement('button');b.className='mood'+(n.mood===m?' active':'');b.textContent=m;b.onclick=()=>{snapshot();n.mood=m;renderMoods();save()};$('moods').append(b)}renderTasks();renderBlocks();renderList();buttons()}function renderMoods(){[...$('moods').children].forEach(b=>b.classList.toggle('active',b.textContent===current().mood))}function renderTasks(){$('tasks').replaceChildren();for(const task of current().tasks){const row=document.createElement('div');row.className='task';const ck=document.createElement('input');ck.type='checkbox';ck.checked=task.done;ck.onchange=()=>{snapshot();task.done=ck.checked;save()};const inp=document.createElement('input');inp.type='text';inp.value=task.text;inp.placeholder='할 일을 적어보세요';inp.onfocus=()=>snapshot();inp.oninput=()=>{task.text=inp.value;save()};const del=document.createElement('button');del.textContent='×';del.onclick=()=>{snapshot();current().tasks=current().tasks.filter(t=>t.id!==task.id);renderTasks();save()};row.append(ck,inp,del);$('tasks').append(row)}}$('addTask').onclick=()=>{snapshot();current().tasks.push({id:uid(),text:'',done:false});renderTasks();save();$('tasks').lastElementChild?.querySelector('input[type=text]')?.focus()};function toolButtons(block,wrap){const tools=document.createElement('div');tools.className='block-tools';const up=document.createElement('button');up.textContent='↑';up.title='위로 이동';up.onclick=()=>move(block.id,-1);const down=document.createElement('button');down.textContent='↓';down.title='아래로 이동';down.onclick=()=>move(block.id,1);const del=document.createElement('button');del.textContent='×';del.title='삭제';del.onclick=()=>{snapshot();current().blocks=current().blocks.filter(b=>b.id!==block.id);renderBlocks();save()};tools.append(up,down,del);wrap.append(tools)}function move(id,dir){const a=current().blocks,i=a.findIndex(b=>b.id===id),j=i+dir;if(j<0||j>=a.length)return;snapshot();[a[i],a[j]]=[a[j],a[i]];renderBlocks();save()}function renderBlocks(){$('blocks').replaceChildren();for(const b of current().blocks){const wrap=document.createElement('div');wrap.className='block';toolButtons(b,wrap);if(b.type==='text'){const el=document.createElement('div');el.className='text-block';el.contentEditable='true';el.dataset.placeholder='여기에 자유롭게 글을 적어보세요…';el.textContent=b.content;let snap=false;el.addEventListener('focus',()=>{if(!snap){snapshot();snap=true}});el.addEventListener('blur',()=>snap=false);el.addEventListener('input',()=>{b.content=el.innerText;save()});wrap.append(el)}else if(b.type==='image'){const img=document.createElement('img');img.className='image-block';img.src=b.src;img.alt='첨부 사진';wrap.append(img)}else if(b.type==='drawing'){const outer=document.createElement('div');outer.className='draw-wrap';const tools=document.createElement('div');tools.className='draw-tools';const pen=document.createElement('button');pen.textContent='✎ 펜';const eraser=document.createElement('button');eraser.textContent='◻ 지우개';const color=document.createElement('input');color.type='color';color.value=b.color||'#9e6c85';const size=document.createElement('input');size.type='range';size.min=1;size.max=25;size.value=b.size||3;const undoDraw=document.createElement('button');undoDraw.textContent='↶ 한 획 취소';const clear=document.createElement('button');clear.textContent='전체 지우기';let erase=false;const update=()=>{pen.classList.toggle('active',!erase);eraser.classList.toggle('active',erase)};pen.onclick=()=>{erase=false;update()};eraser.onclick=()=>{erase=true;update()};color.onchange=()=>{b.color=color.value;save()};size.onchange=()=>{b.size=+size.value;save()};undoDraw.onclick=()=>{if(!b.strokes?.length)return;snapshot();b.strokes.pop();draw();save()};clear.onclick=()=>{if(!confirm('이 그림을 모두 지울까요?'))return;snapshot();b.strokes=[];draw();save()};tools.append(pen,eraser,color,size,undoDraw,clear);outer.append(tools);const canvas=document.createElement('canvas');canvas.className='draw-canvas';outer.append(canvas);wrap.append(outer);const ctx=canvas.getContext('2d');const draw=()=>{const rect=canvas.getBoundingClientRect(),ratio=window.devicePixelRatio||1;canvas.width=Math.round(rect.width*ratio);canvas.height=Math.round(rect.height*ratio);ctx.setTransform(ratio,0,0,ratio,0,0);ctx.clearRect(0,0,rect.width,rect.height);for(const stroke of b.strokes||[]){if(!stroke.points?.length)continue;ctx.beginPath();ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=stroke.color;ctx.lineWidth=stroke.size;const pts=stroke.points;ctx.moveTo(pts[0][0]*rect.width,pts[0][1]*rect.height);if(pts.length===1){ctx.lineTo(pts[0][0]*rect.width+.01,pts[0][1]*rect.height+.01)}else for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0]*rect.width,pts[i][1]*rect.height);ctx.stroke()}};const pos=e=>{const r=canvas.getBoundingClientRect();return [Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))]};let stroke=null;canvas.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'&&e.isPrimary===false)return;e.preventDefault();snapshot();stroke={color:erase?'#ffffff':color.value,size:erase?Math.max(20,+size.value*3):+size.value,points:[pos(e)]};b.strokes??=[];b.strokes.push(stroke);canvas.setPointerCapture(e.pointerId);draw()});canvas.addEventListener('pointermove',e=>{if(!stroke)return;e.preventDefault();stroke.points.push(pos(e));draw()});const end=()=>{if(!stroke)return;stroke=null;save()};canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);update();requestAnimationFrame(draw);const observer=new ResizeObserver(()=>{if(canvas.isConnected)draw();else observer.disconnect()});observer.observe(canvas)}$('blocks').append(wrap)}}function appendBlock(b){snapshot();current().blocks.push(b);renderBlocks();save();if(b.type==='text'){$('blocks').lastElementChild?.querySelector('.text-block')?.focus()}else $('blocks').lastElementChild?.scrollIntoView({behavior:'smooth',block:'nearest'})}$('addText').onclick=()=>appendBlock({id:uid(),type:'text',content:''});$('addDrawing').onclick=()=>appendBlock({id:uid(),type:'drawing',strokes:[],color:'#9e6c85',size:3});$('addImage').onclick=()=>$('imageFile').click();function compress(file){return new Promise((resolve,reject)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{const max=1600,ratio=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*ratio);c.height=Math.round(img.height*ratio);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);resolve(c.toDataURL('image/jpeg',.78))};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('사진을 읽지 못했어요'))};img.src=url})}$('imageFile').onchange=async e=>{for(const file of e.target.files){try{const src=await compress(file);appendBlock({id:uid(),type:'image',src})}catch{alert('사진을 추가하지 못했어요.')}}e.target.value=''};$('title').onfocus=()=>snapshot();$('title').oninput=e=>{current().title=e.target.value;save()};$('newNote').onclick=()=>{snapshot();const n=fresh();notes.unshift(n);active=n.id;render();save();setSidebarHidden(true)};$('deleteNote').onclick=()=>{if(!confirm('이 노트를 삭제할까요?'))return;snapshot();notes=notes.filter(n=>n.id!==active);if(!notes.length)notes=[fresh()];active=notes[0].id;render();save()};const sidebarHiddenKey='moa-note-sidebar-hidden';
function setSidebarHidden(hidden){document.querySelector('.app').classList.toggle('sidebar-hidden',hidden);$('sidebar').classList.toggle('open',!hidden);$('menu').textContent=hidden?'☰ 노트 목록':'☰ 목록 접기';$('menu').setAttribute('aria-expanded',String(!hidden));try{localStorage.setItem(sidebarHiddenKey,hidden?'1':'0')}catch{}}
setSidebarHidden(window.matchMedia('(pointer:coarse)').matches && (localStorage.getItem(sidebarHiddenKey)==='1'||window.innerWidth<=760));
$('menu').onclick=()=>setSidebarHidden(!document.querySelector('.app').classList.contains('sidebar-hidden'));
$('closeSidebar').onclick=()=>setSidebarHidden(true);$('export').onclick=()=>{const blob=new Blob([JSON.stringify({notes,active},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='moa-note-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('import').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const v=JSON.parse(await f.text());if(!Array.isArray(v.notes)||!v.notes.every(n=>Array.isArray(n.blocks)))throw Error();if(!confirm('현재 노트 전체를 백업 내용으로 교체할까요?'))return;snapshot();notes=v.notes;active=notes.some(n=>n.id===v.active)?v.active:notes[0]?.id;if(!notes.length){notes=[fresh()];active=notes[0].id}render();save()}catch{alert('올바른 모아 노트 백업 파일이 아니에요.')}e.target.value=''};window.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!e.target.closest('input,[contenteditable]')){e.preventDefault();e.shiftKey?$('forward').click():$('back').click()}});(async()=>{await openDB();let stored=await dbGet();if(!stored){try{stored=JSON.parse(localStorage.getItem(KEY))}catch{}}notes=Array.isArray(stored?.notes)&&stored.notes.length?stored.notes:[fresh()];active=notes.some(n=>n.id===stored?.active)?stored.active:notes[0].id;render();save()})()})();
</script></body></html>
